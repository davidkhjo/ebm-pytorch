site_name: ebm-pytorch
site_description: A small, reliable PyTorch library for training and using energy-based models.
site_url: https://dkjo8.github.io/ebm-pytorch/
repo_url: https://github.com/dkjo8/ebm-pytorch
repo_name: dkjo8/ebm-pytorch

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source
            show_root_heading: true
            separate_signature: true

nav:
  - Home: index.md
  - Guides:
      - Training methods: training.md
      - Sampling: sampling.md
      - Evaluating EBMs: evaluation.md
      - Composing energies: composition.md
  - Examples: examples.md
  - Benchmarks: benchmarks.md
  - API reference:
      - ebm (top level): api/ebm.md
      - Samplers: api/samplers.md
      - Losses: api/losses.md
      - Energies & composition: api/energy.md
      - JEM: api/jem.md
      - AIS: api/ais.md
      - Evaluation: api/eval.md
      - Networks: api/nets.md
      - Datasets: api/datasets.md
      - Replay buffer: api/buffer.md
      - Training: api/training.md
      - Utilities: api/utils.md
      - Visualization: api/viz.md
