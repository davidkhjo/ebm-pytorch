[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebmkit"
dynamic = ["version"]
description = "A PyTorch library for training and using energy-based models (EBMs)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David" }]
keywords = [
    "energy-based-models",
    "ebm",
    "generative-models",
    "langevin-dynamics",
    "contrastive-divergence",
    "score-matching",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.8", "hatch>=1.9", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/davidkhjo/ebmkit"
Repository = "https://github.com/davidkhjo/ebmkit"
Issues = "https://github.com/davidkhjo/ebmkit/issues"
Changelog = "https://github.com/davidkhjo/ebmkit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ebm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ebm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "PERF", "RUF"]
# The library uses mathematical Unicode (σ, ε, ρ, μ, …) throughout its docs and
# comments on purpose; the "ambiguous character" rules would fight that.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # lambdas are fine in tests

[tool.mypy]
files = ["src/ebm"]
ignore_missing_imports = true       # torch / matplotlib ship partial stubs

[tool.coverage.run]
source = ["ebm"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
